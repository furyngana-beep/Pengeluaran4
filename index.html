<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DompetKu Mobile - Grouped</title>
    <style>
        :root {
            --primary: #6366f1;
            --success: #22c55e;
            --danger: #ef4444;
            --dark: #1e293b;
            --light: #f8fafc;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f8fafc;
            color: var(--dark);
            margin: 0;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            background: white;
            padding: 1.5rem;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
        }

        h2 { text-align: center; font-weight: 800; margin-top: 0; color: var(--primary); }

        .balance-card {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: white;
            padding: 1.5rem;
            border-radius: 1.2rem;
            text-align: center;
            margin-bottom: 1.5rem;
            box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.3);
        }

        .balance-card h1 { margin: 0.5rem 0; font-size: 1.8rem; letter-spacing: -1px; }

        .type-selector {
            display: flex;
            background: #f1f5f9;
            padding: 5px;
            border-radius: 10px;
            margin-bottom: 1rem;
        }

        .type-option {
            flex: 1;
            text-align: center;
            padding: 10px;
            cursor: pointer;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .type-option.active.plus { background: var(--success); color: white; }
        .type-option.active.minus { background: var(--danger); color: white; }

        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.85rem; color: #64748b; }

        input {
            width: 100%;
            padding: 12px;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
        }

        .btn-group { display: flex; gap: 10px; margin-top: 1.2rem; }

        button {
            flex: 2;
            padding: 14px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-add { background: var(--primary); color: white; }
        .btn-reset { flex: 1; background: #f1f5f9; color: #64748b; }

        /* Style Grouping */
        .month-group {
            margin-top: 1.5rem;
        }

        .month-header {
            background: #f8fafc;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 700;
            color: #64748b;
            margin-bottom: 10px;
            text-transform: uppercase;
            border-left: 3px solid #cbd5e1;
        }

        .list { list-style: none; padding: 0; margin: 0; }

        .item {
            background: #fff;
            border: 1px solid #f1f5f9;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item.plus { border-right: 4px solid var(--success); }
        .item.minus { border-right: 4px solid var(--danger); }

        .item-info strong { display: block; font-size: 0.95rem; }
        .item-info span { font-size: 0.75rem; color: #94a3b8; }

        .amount-text { font-weight: 700; font-size: 0.9rem; }
        .amount-text.plus { color: var(--success); }
        .amount-text.minus { color: var(--danger); }

        .delete-btn {
            margin-left: 10px;
            background: #fff1f2;
            color: var(--danger);
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            align-items: center; justify-content: center;
            z-index: 100;
        }

        .modal-content {
            background: white;
            padding: 1.5rem;
            border-radius: 1.2rem;
            text-align: center;
            width: 85%;
            max-width: 320px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>DompetKu</h2>

    <div class="balance-card">
        <small>Sisa Saldo Kamu</small>
        <h1 id="balance">Rp 0</h1>
    </div>

    <div class="type-selector">
        <div id="optPlus" class="type-option active plus" onclick="setType('plus')">Pemasukan</div>
        <div id="optMinus" class="type-option minus" onclick="setType('minus')">Pengeluaran</div>
    </div>

    <div class="form-group">
        <label>Keterangan</label>
        <input type="text" id="text" placeholder="Gaji, Kopi, dll">
    </div>
    <div class="form-group">
        <label>Jumlah Uang</label>
        <input type="number" id="amount" placeholder="0" inputmode="numeric">
    </div>
    <div class="form-group">
        <label>Tanggal</label>
        <input type="date" id="date">
    </div>
    
    <div class="btn-group">
        <button class="btn-add" onclick="addTransaction()">Simpan</button>
        <button class="btn-reset" onclick="showModal()">Reset</button>
    </div>

    <div id="history-container">
        </div>
</div>

<div id="resetModal" class="modal">
    <div class="modal-content">
        <h3>Hapus Semua Data?</h3>
        <div class="btn-group">
            <button style="background: var(--danger); color: white;" onclick="resetData()">Ya, Hapus</button>
            <button class="btn-reset" onclick="hideModal()">Batal</button>
        </div>
    </div>
</div>

<script>
    const balance = document.getElementById('balance');
    const historyContainer = document.getElementById('history-container');
    const text = document.getElementById('text');
    const amount = document.getElementById('amount');
    const dateInput = document.getElementById('date');
    const modal = document.getElementById('resetModal');

    let currentType = 'plus';
    let transactions = JSON.parse(localStorage.getItem('transactions')) || [];

    const monthsFull = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
    const monthsShort = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
    const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];

    function setType(type) {
        currentType = type;
        document.getElementById('optPlus').classList.toggle('active', type === 'plus');
        document.getElementById('optMinus').classList.toggle('active', type === 'minus');
    }

    function formatDateDisplay(dateStr) {
        const d = new Date(dateStr);
        return `${days[d.getDay()]}, ${d.getDate()} ${monthsShort[d.getMonth()]} ${d.getFullYear()}`;
    }

    function formatRupiah(num) {
        return 'Rp ' + Math.abs(num).toLocaleString('id-ID');
    }

    function addTransaction() {
        if (text.value.trim() === '' || amount.value.trim() === '' || dateInput.value === '') return;

        const val = Math.abs(+amount.value);
        const transaction = {
            id: Math.floor(Math.random() * 1000000),
            text: text.value,
            amount: currentType === 'plus' ? val : -val,
            date: dateInput.value
        };

        transactions.push(transaction);
        updateLocalStorage();
        init();
        text.value = ''; amount.value = '';
    }

    function removeTransaction(id) {
        transactions = transactions.filter(t => t.id !== id);
        updateLocalStorage();
        init();
    }

    function init() {
        historyContainer.innerHTML = '';
        const total = transactions.reduce((acc, item) => acc + item.amount, 0);
        balance.innerText = 'Rp ' + total.toLocaleString('id-ID');

        // Urutkan transaksi berdasarkan tanggal terbaru
        const sorted = [...transactions].sort((a, b) => new Date(b.date) - new Date(a.date));

        // Pengelompokan berdasarkan Bulan & Tahun
        const groups = sorted.reduce((acc, t) => {
            const d = new Date(t.date);
            const key = `${monthsFull[d.getMonth()]} ${d.getFullYear()}`;
            if (!acc[key]) acc[key] = [];
            acc[key].push(t);
            return acc;
        }, {});

        for (const monthYear in groups) {
            const groupDiv = document.createElement('div');
            groupDiv.className = 'month-group';
            groupDiv.innerHTML = `<div class="month-header">${monthYear}</div>`;
            
            const ul = document.createElement('ul');
            ul.className = 'list';

            groups[monthYear].forEach(t => {
                const isPlus = t.amount >= 0;
                const li = document.createElement('li');
                li.className = `item ${isPlus ? 'plus' : 'minus'}`;
                li.innerHTML = `
                    <div class="item-info">
                        <strong>${t.text}</strong>
                        <span>${formatDateDisplay(t.date)}</span>
                    </div>
                    <div style="display: flex; align-items: center;">
                        <span class="amount-text ${isPlus ? 'plus' : 'minus'}">
                            ${isPlus ? '+' : '-'}${formatRupiah(t.amount)}
                        </span>
                        <button class="delete-btn" onclick="removeTransaction(${t.id})">×</button>
                    </div>
                `;
                ul.appendChild(li);
            });
            
            groupDiv.appendChild(ul);
            historyContainer.appendChild(groupDiv);
        }
    }

    function updateLocalStorage() { localStorage.setItem('transactions', JSON.stringify(transactions)); }
    function showModal() { modal.style.display = 'flex'; }
    function hideModal() { modal.style.display = 'none'; }
    function resetData() { transactions = []; updateLocalStorage(); init(); hideModal(); }

    dateInput.valueAsDate = new Date();
    init();
</script>

</body>
</html>
