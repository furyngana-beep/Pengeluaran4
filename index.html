<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Catatan Keuangan</title>

<style>
* {
  box-sizing: border-box;
  font-family: 'Segoe UI', sans-serif;
}

body {
  margin: 0;
  background: #eef2f7;
}

/* HEADER */
.header {
  background: linear-gradient(135deg, #2193b0, #6dd5ed);
  color: white;
  padding: 20px;
  font-size: 20px;
  font-weight: bold;
  border-bottom-left-radius: 20px;
  border-bottom-right-radius: 20px;
}

/* CONTAINER */
.container {
  padding: 15px;
  margin-top: -10px;
}

/* CARD */
.card {
  background: white;
  padding: 15px;
  border-radius: 18px;
  box-shadow: 0 6px 15px rgba(0,0,0,0.08);
  margin-bottom: 15px;
}

/* SALDO */
.saldo {
  text-align: center;
}

.saldo span {
  font-size: 24px;
  font-weight: bold;
  color: #2193b0;
}

/* INPUT */
input, select {
  width: 100%;
  padding: 13px;
  margin-top: 10px;
  border-radius: 12px;
  border: 1px solid #ddd;
  font-size: 14px;
}

/* BUTTON */
button {
  width: 100%;
  padding: 13px;
  border-radius: 12px;
  border: none;
  font-weight: bold;
  margin-top: 12px;
}

.btn-add {
  background: linear-gradient(135deg, #2193b0, #6dd5ed);
  color: white;
}

.btn-reset {
  background: #ff4d4d;
  color: white;
}

/* LIST */
.list-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px;
  border-radius: 14px;
  background: #f9fbfd;
  margin-top: 10px;
  transition: 0.2s;
}

.list-item:hover {
  transform: scale(1.02);
}

/* INFO */
.item-info b {
  font-size: 15px;
}

.item-info span {
  font-size: 12px;
  color: #888;
}

/* VALUE */
.income {
  color: #00d86b;
  font-weight: bold;
  
}

.expense {
  color: #ff4d4d;
  font-weight: bold;
}

/* DELETE */
.delete-btn {
  background: none;
  font-size: 18px;
  color: #ff4d4d;
}

/* MODAL */
.modal {
  display: none;
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.4);
  justify-content: center;
  align-items: center;
}

.modal-content {
  background: white;
  padding: 20px;
  border-radius: 15px;
  width: 80%;
  text-align: center;
}

.modal-content button {
  width: 40%;
  margin: 5px;
}
</style>
</head>

<body>

<div class="header">💰 Catatan Keuangan</div>

<div class="container">

  <div class="card saldo">
    Saldo<br>
    <span>Rp <span id="saldo">0</span></span>
  </div>

  <div class="card">
    <select id="tipe">
      <option value="pemasukan">Pemasukan</option>
      <option value="pengeluaran">Pengeluaran</option>
    </select>

    <input type="text" id="keterangan" placeholder="Keterangan">
    <input type="number" id="harga" placeholder="Jumlah (Rp)">
    <input type="date" id="tanggal">

    <button class="btn-add" onclick="tambah()">+ Tambah</button>
  </div>

  <div class="card" id="list"></div>

  <button class="btn-reset" onclick="showModal()">Reset Data</button>

</div>

<div class="modal" id="modal">
  <div class="modal-content">
    <p>Yakin ingin reset semua data?</p>
    <button onclick="resetData()">Ya</button>
    <button onclick="hideModal()">Tidak</button>
  </div>
</div>

<script>
let transaksi = JSON.parse(localStorage.getItem("data")) || [];

/* 🔥 FORMAT HARI + BULAN + TAHUN */
function formatTanggal(tgl) {
  const hari = ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
  const bulan = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];

  const date = new Date(tgl);
  return `${hari[date.getDay()]}, ${date.getDate()} ${bulan[date.getMonth()]} ${date.getFullYear()}`;
}

/* 🔥 GROUP BY BULAN */
function groupByBulan(data) {
  const bulan = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
  let hasil = {};

  data.forEach(item => {
    let date = new Date(item.tanggal);
    let key = `${bulan[date.getMonth()]} ${date.getFullYear()}`;

    if (!hasil[key]) {
      hasil[key] = {
        pemasukan: [],
        pengeluaran: []
      };
    }

    hasil[key][item.tipe].push(item);
  });

  return hasil;
}

function render() {
  const list = document.getElementById("list");
  const saldoEl = document.getElementById("saldo");

  list.innerHTML = "";
  let saldo = 0;

  /* hitung saldo tetap sama */
  transaksi.forEach(item => {
    saldo += item.tipe === "pemasukan" ? item.harga : -item.harga;
  });

  /* grouping */
  const grouped = groupByBulan(transaksi);

  Object.keys(grouped).reverse().forEach(bulanKey => {
    const group = grouped[bulanKey];

    let section = `<div style="margin-top:15px;">
      <h3 style="margin:10px 0;color:#2193b0;">📅 ${bulanKey}</h3>
    `;

    /* PEMASUKAN */
    if (group.pemasukan.length > 0) {
      section += `<div style="font-weight:bold;color:green;margin-top:5px;"></div>`;
      group.pemasukan.forEach(item => {
        let index = transaksi.indexOf(item);

        section += `
        <div class="list-item">
          <div class="item-info">
            <p>${item.keterangan}</p>
            <span>${formatTanggal(item.tanggal)}</span>
          </div>
          <div>
            <div class="income">+Rp ${item.harga.toLocaleString()}</div>
            <button class="delete-btn" onclick="hapus(${index})">🗑</button>
          </div>
        </div>`;
      });
    }

    /* PENGELUARAN */
    if (group.pengeluaran.length > 0) {
      section += `<div style="font-weight:bold;color:red;margin-top:10px;"></div>`;
      group.pengeluaran.forEach(item => {
        let index = transaksi.indexOf(item);

        section += `
        <div class="list-item">
          <div class="item-info">
            <p>${item.keterangan}</p>
            <span>${formatTanggal(item.tanggal)}</span>
          </div>
          <div>
            <div class="expense">-Rp ${item.harga.toLocaleString()}</div>
            <button class="delete-btn" onclick="hapus(${index})">🗑</button>
          </div>
        </div>`;
      });
    }

    section += `</div>`;
    list.innerHTML += section;
  });

  saldoEl.textContent = saldo.toLocaleString();
  localStorage.setItem("data", JSON.stringify(transaksi));
}

/* fungsi lama tetap */
function tambah() {
  const tipe = document.getElementById("tipe").value;
  const keterangan = document.getElementById("keterangan").value;
  const harga = parseInt(document.getElementById("harga").value);
  const tanggal = document.getElementById("tanggal").value;

  if (!keterangan || !harga || !tanggal) {
    alert("Isi semua data!");
    return;
  }

  transaksi.push({ tipe, keterangan, harga, tanggal });

  document.getElementById("keterangan").value = "";
  document.getElementById("harga").value = "";
  document.getElementById("tanggal").value = "";

  render();
}

function hapus(index) {
  transaksi.splice(index, 1);
  render();
}

function showModal() {
  document.getElementById("modal").style.display = "flex";
}

function hideModal() {
  document.getElementById("modal").style.display = "none";
}

function resetData() {
  transaksi = [];
  render();
  hideModal();
}

render();
</script>

</body>
      </html>
